{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Shield</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            height: 100%;
            overflow: hidden;
        }

        .page-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            direction: rtl;
        }

        .form-section {
            flex: 1;
            background-color: #f7fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 45px 40px;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(139, 189, 246, 0.3);
        }

        .login-box h2 {
            color: #476596;
            font-size: 26px;
            margin-bottom: 35px;
            font-weight: 700;
        }

        .alert-error {
            background-color: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .input-container {
            position: relative;
            margin-bottom: 28px;
            width: 100%;
        }

        .input-container input {
            width: 100%;
            padding: 16px;
            font-size: 15px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            background: transparent;
            transition: all 0.2s ease;
            color: #334155;
            text-align: right;
        }

        .password-wrapper input {
            padding-left: 45px; 
        }

        .input-container label {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: #ffffff;
            padding: 0 6px;
            color: #94a3b8;
            font-size: 15px;
            pointer-events: none;
            transition: 0.2s ease all;
        }

        .input-container.focused label,
        .input-container input:focus ~ label,
        .input-container input:not(:placeholder-shown) ~ label {
            top: 0;
            font-size: 12px;
            color: #3b42c4;
            font-weight: 600;
        }

        .input-container.focused input,
        .input-container input:focus {
            border-color: #3b42c4;
            box-shadow: 0 0 0 3px rgba(59, 66, 196, 0.1);
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #94a3b8;
            font-size: 18px;
            transition: color 0.2s;
            z-index: 10;
        }

        .toggle-password:hover {
            color: #3b42c4;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background-color: #3b4af0;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .submit-btn:hover {
            background-color: #2a30a3;
            box-shadow: 0 6px 20px rgba(59, 66, 196, 0.3);
        }

        .brand-section {
            flex: 1;
            background: linear-gradient(145deg, #749ed6 0%, #13366d 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            color: white;
        }

        .brand-content {
            text-align: center;
            max-width: 450px;
        }

        .logo-glass-card {
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 25px auto;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        }

        .logo-img {
            width: 75px;
            height: 75px;
            object-fit: contain;
        }

        .brand-content h1 {
            font-size: 44px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .brand-content p {
            font-size: 16px;
            color: #cbd5e1;
            line-height: 1.6;
            font-weight: 300;
        }

        @media (max-width: 768px) {
            .page-container {
                flex-direction: column-reverse;
            }
            .brand-section {
                height: 35%;
                flex: none;
                padding: 20px;
            }
            .form-section {
                height: 65%;
                flex: none;
                padding: 20px;
            }
            .brand-content h1 {
                font-size: 32px;
            }
            .logo-glass-card {
                width: 90px;
                height: 90px;
                margin-bottom: 15px;
            }
            .logo-img {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        
        <div class="form-section">
            <div class="login-box">
                <h2>تسجيل دخول للنظام</h2>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert-error">{{ message }}</div>
                    {% endfor %}
                {% endif %}
                
                <form method="POST" action="{% url 'users:login' %}">
                    {% csrf_token %}
                    
                    <div class="input-container">
                        <input type="text" id="username" name="username" required placeholder=" ">
                        <label for="username">اسم المستخدم</label>
                    </div>
                    
                    <div class="input-container password-wrapper">
                        <input type="password" id="password" name="password" required placeholder=" ">
                        <label for="password">كلمة المرور</label>
                        <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
                    </div>
                    
                    <button type="submit" class="submit-btn">تسجيل</button>
                </form>
            </div>
        </div>

        <div class="brand-section">
            <div class="brand-content">
                <div class="logo-glass-card">
                    <img src="{% static 'users/images/shield-logo.png' %}" alt="Shield Logo" class="logo-img">
                </div>
                <h1>Shield</h1>
                <p>نحو توزيع عادل وشفاف لمواردنا الوطنية</p>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const passwordInput = document.getElementById('password');
            const togglePasswordIcon = document.getElementById('togglePassword');

            if (togglePasswordIcon && passwordInput) {
                togglePasswordIcon.addEventListener('click', function () {
                    const isPassword = passwordInput.getAttribute('type') === 'password';
                    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                    this.classList.toggle('fa-eye');
                    this.classList.toggle('fa-eye-slash');
                });
            }

            const inputs = document.querySelectorAll('.input-container input');
            inputs.forEach(input => {
                if (input.value !== "") {
                    input.parentElement.classList.add('focused');
                }
                input.addEventListener('focus', () => {
                    input.parentElement.classList.add('focused');
                });
                input.addEventListener('blur', () => {
                    if (input.value === "") {
                        input.parentElement.classList.remove('focused');
                    }
                });
            });
        });
    </script>
</body>
</html>
